version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # [추가됨] 그룹 조건: 모든 npm 업데이트를 묶어서 하나의 PR로 만듦
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # [추가됨] 자동 머지를 위한 라벨(Label) 자동 부여 설정
    labels:
      - "dependencies"
      - "auto-merge"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"