name: Node.js Package Publish

# 언제 이 파이프라인이 실행될지 정합니다. (일단 수동으로 실행하도록 설정)
on:
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    # GitHub 패키지에 코드를 올리려면 '쓰기(write)' 권한이 필요합니다.
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 내 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 세팅하기
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          # 여기서 권한을 확인할 때 사용할 토큰을 지정합니다.

      - name: 3. 패키지 배포하기! (Publish)
        # GitHub이 기본적으로 제공하는 임시 비밀번호(GITHUB_TOKEN)를 사용해서 배포합니다.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}