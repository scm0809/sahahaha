name: NPM Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 자정(UTC)마다 '자동'으로 알아서 실행!
  workflow_dispatch: # 지금 당장 캡처하기 위한 '수동' 버튼

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. npm audit 보안 검사 실행 및 리포트 저장
        run: npm audit > audit-report.txt || true 

      - name: 3. 검사 결과를 깃허브 이슈(Issue)로 자동 발행
        # 에러를 유발했던 라벨(--label) 부분을 안전하게 제거했습니다.
        run: |
          gh issue create \
            --title "🚨 주간 npm 보안 스캔 리포트" \
            --body-file audit-report.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}