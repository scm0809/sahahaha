name: CI 파이프라인 (과제 1 & 과제 2 Matrix)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # 💡 [과제 2 수정 포인트 1] Matrix 전략 설정
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # 우분투, 윈도우, 맥OS 3가지 환경
        python-version: ['3.10', '3.11'] # 파이썬 3.10, 3.11 2가지 버전
    
    # 💡 [과제 2 수정 포인트 2] 위에서 정의한 OS 변수 사용
    runs-on: ${{ matrix.os }} 

    steps:
    - name: 1. 내 코드 가져오기 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        # 💡 [과제 2 수정 포인트 3] 위에서 정의한 파이썬 버전 변수 사용
        python-version: ${{ matrix.python-version }} 

    - name: 3. 필요 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # Windows 환경 호환성을 위해 if문 수정
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # Windows 실행 시 bash 쉘을 명시적으로 사용
      shell: bash

    - name: 4. 코드 문법 검사 (Lint)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. 단위 테스트 실행 (Test)
      run: |
        pytest
    - name: 6. 시크릿(비밀번호) 마스킹 확인 (과제 3)
      # 💡 [과제 3 포인트] 깃허브에 등록한 Secret을 환경 변수(env)로 불러옵니다.
      env: 
        MY_SECRET: ${{ secrets.API_KEY }}
      run: |
        echo "이 글씨 뒤에 비밀번호가 노출되면 안 됩니다!"
        echo "나의 API 키는 $MY_SECRET 입니다."
        echo "깃허브가 똑똑하게 *** 로 가려주는지 로그를 확인해보세요."
      shell: bash    