name: 기본 CI 파이프라인 (과제 1)

# 어떤 상황에서 작동할지 (트리거)
on:
  push:
    branches: [ "main" ] # 메인 브랜치에 코드가 올라올 때 실행

jobs:
  build-and-test:
    runs-on: ubuntu-latest # 깃허브가 빌려주는 가상 컴퓨터(우분투)

    steps:
    - name: 1. 내 코드 가져오기 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 필요 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 코드 문법 검사 (Lint)
      run: |
        # 치명적인 문법 오류만 간단히 검사합니다.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. 단위 테스트 실행 (Test)
      run: |
        # 아까 만든 test_main.py가 성공하는지 검사합니다.
        pytest