name: Week 12 CI - Test Automation

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: 🟢 Node.js 환경 세팅
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🛠️ 의존성 모듈 설치
        run: |
          cd week_12
          npm install

      - name: 🧪 Jest 단위 테스트 및 커버리지 측정 (80% 이상 달성)
        run: |
          cd week_12
          npm run test

      - name: 🌐 Playwright E2E 테스트 자동 실행
        run: |
          cd week_12
          npx playwright install --with-deps
          npm run test:e2e
